name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build-time placeholders only: instrumentation.ts's bootstrap() never runs
          # during `next build`'s static-generation workers, and the whole app is
          # force-dynamic (app/layout.tsx) specifically so no page needs real
          # credentials to prerender. Never used to actually contact Firestore.
          FIRESTORE_PROJECT_ID: ci-build-placeholder
          RULEBRANCH_SESSION_SECRET: ci-build-placeholder-secret
      - run: npm test
      - run: node scripts/verify-built-job-reconcile.cjs
  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/worker } }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m pip check
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      # Audit the project dependencies rather than the unpublished local package
      # itself. --strict makes dependency-collection failures fail the job.
      - run: python -m pip_audit --strict .
      - run: python scripts/lint.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      # No real project_id/credentials in CI: validate only checks internal
      # configuration consistency, not that a live GCP project can be reached.
      - run: terraform validate
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Smoke-tests the exact artifacts infra/main.tf's web_image/worker_image are
      # expected to be built from, so a broken Dockerfile fails CI instead of only
      # surfacing at `terraform apply` time. Build context MUST be the repo root:
      # both Dockerfiles COPY contracts/ from alongside apps/web|worker (see the
      # comment at the top of each Dockerfile).
      - run: docker build -f apps/web/Dockerfile -t rulebranch-web:ci .
      - run: docker build -f apps/worker/Dockerfile -t rulebranch-worker:ci .
      # Docker build succeeding doesn't prove the image can actually start: verify
      # the module tree (including the contracts/ files just copied in) imports.
      - run: docker run --rm rulebranch-worker:ci python -c "import rulebranch.main"
